title:"Схватываешь на лету",group:"Бой",defaultDone:!1,detail:"Подстрелить гранату в воздухе; своя граната подходит.",location:"",ref:"21"},{id:"trophy_22",category:"trophies",title:"Флешка-рояль",group:"Коллекционный / пропускаемый",defaultDone:!1,detail:"Собрать все флешки улучшений; не пропустить Integral-A в НИИЧАЗ.",location:"",ref:"22"},{id:"trophy_23",category:"trophies",title:"Мокрого места не оставить",group:"Бой",defaultDone:!1,detail:"Убить тушкана из РПГ или подствольного гранатомёта.",location:"",ref:"23"},{id:"trophy_24",category:"trophies",title:"Консервная банка",group:"Бой",defaultDone:!1,detail:"Убить врага в экзоскелете, нанося весь урон только ножом.",location:"",ref:"24"},{id:"trophy_25",category:"trophies",title:"Купоны карман жгут",group:"Накопительный",defaultDone:!1,detail:"Потратить 1 000 000 купонов; покупки/ремонт можно фармить через загрузку.",location:"",ref:"25"},{id:"trophy_26",category:"trophies",title:"Попрыгунчик",group:"Ситуативный",defaultDone:!1,detail:"Прыгнуть с 30+ м и приземлиться в «Подушку».",location:"",ref:"26"},{id:"trophy_27",category:"trophies",title:"Беги, сталкер, беги!",group:"Ситуативный",defaultDone:!1,detail:"Спровоцировать химеру и убежать до полного снятия агрессии.",location:"",ref:"27"},{id:"trophy_28",category:"trophies",title:"Без шума и пыли",group:"Бой / пропускаемый",defaultDone:!1,detail:"Впервые зачистить отмеченный лагерь, не подняв тревогу.",location:"",ref:"28"},{id:"trophy_29",category:"trophies",title:"Чужими руками",group:"Ситуативный",defaultDone:!1,detail:"Дождаться победы одного отряда над другим и уничтожить победителей.",location:"",ref:"29"},{id:"trophy_30",category:"trophies",title:"Отмычка",group:"Ситуативный",defaultDone:!1,detail:"Заманить мутанта в аномалию.",location:"",ref:"30"},{id:"trophy_31",category:"trophies",title:"Добро пожаловать в Зону",group:"Сюжет",defaultDone:!1,detail:"Завершить пролог.",location:"",ref:"31"},{id:"trophy_32",category:"trophies",title:"Удачной охоты, сталкер",group:"Сюжет",defaultDone:!1,detail:"Покинуть Малую Зону.",location:"",ref:"32"},{id:"trophy_33",category:"trophies",title:"Будешь гренку?",group:"Сюжет",defaultDone:!1,detail:"Встретить Шрама на Лесопилке.",location:"",ref:"33"},{id:"trophy_34",category:"trophies",title:"Главный приз",group:"Сюжет",defaultDone:!1,detail:"Вернуть Сканер на базе Чистого неба.",location:"",ref:"34"},{id:"trophy_35",category:"trophies",title:"Хрустальный замок",group:"Сюжет",defaultDone:!1,detail:"Покинуть разрушенный НИИЧАЗ.",location:"",ref:"35"},{id:"trophy_36",category:"trophies",title:"На всё воля Монолита",group:"Сюжет",defaultDone:!1,detail:"Убить Фауста.",location:"",ref:"36"},{id:"trophy_37",category:"trophies",title:"Вижу, у тебя много вопросов",group:"Сюжет",defaultDone:!1,detail:"Встретить Представителя О- Сознания в X-17.",location:"",ref:"37"},{id:"trophy_38",category:"trophies",title:"Врачебная тайна",group:"Сюжет",defaultDone:!1,detail:"Раскрыть тайну Доктора.",location:"",ref:"38"},{id:"trophy_39",category:"trophies",title:"Живая легенда",group:"Сюжет",defaultDone:!1,detail:"Встретить Стрелка в X-3.",location:"",ref:"39"},{id:"trophy_40",category:"trophies",title:"Хранитель Припяти",group:"Сюжет",defaultDone:!1,detail:"Встретить Дегтярёва и помочь ДК «Энергетик».",location:"",ref:"40"},{id:"trophy_41",category:"trophies",title:"Прекрасный новый мир",group:"Финал",defaultDone:!1,detail:"Варта: «Жизнь для живущих» → «Я не ваш враг».",location:"",ref:"41"},{id:"trophy_42",category:"trophies",title:"Сегодня не кончится никогда",group:"Финал",defaultDone:!1,detail:"Искра: «Вечная весна» → «Убежать».",location:"",ref:"42"},{id:"trophy_43",category:"trophies",title:"Она никогда не будет свободна",group:"Финал",defaultDone:!1,detail:"Стрелок: «Жизнь для живущих» → «Убежать» → «Выстрелить».",location:"",ref:"43"},{id:"trophy_44",category:"trophies",title:"Проект Y",group:"Финал",defaultDone:!1,detail:"Кайманов: «Жизнь для живущих» → «Убежать» → «Опустить оружие».",location:"",ref:"44"},{id:"trophy_45",category:"trophies",title:"Варте по пасти",group:"Пропускаемый",defaultDone:!1,detail:"Ветка Зотова: освободить пленного бандита, убив его охрану Варты.",location:"",ref:"45"},{id:"trophy_46",category:"trophies",title:"Сталкерская смекалка",group:"Пропускаемый",defaultDone:!1,detail:"«Халтурка»: достать детали снаружи, не трогая рубильники и не входя на склад.",location:"",ref:"46"},{id:"trophy_47",category:"trophies",title:"Как в старые добрые",group:"Пропускаемый",defaultDone:!1,detail:"«Три капитана»: предать Соню Калину, спасти Бороду и Султана.",location:"",ref:"47"},{id:"trophy_48",category:"trophies",title:"В яблочко",group:"Пропускаемый",defaultDone:!1,detail:"Согласиться на игру Худрука и сбить три яблока до конца отсчёта.",location:"",ref:"48"},{id:"trophy_49",category:"trophies",title:"Крещение огнём",group:"Пропускаемый / таймер",defaultDone:!1,detail:"После НИИЧАЗ выполнить «На грани» и защитить Залесье.",location:"",ref:"49"},{id:"trophy_50",category:"trophies",title:"На поводу",group:"Пропускаемый",defaultDone:!1,detail:"Помочь Щербе, собрать четыре ошейника и сразу уничтожить блокиратор.",location:"",ref:"50"},{id:"trophy_51",category:"trophies",title:"Ход сделан",group:"Пропускаемый",defaultDone:!1,detail:"Пощадить Доцента, получить координаты тайника Шаха и забрать оружие.",location:"",ref:"51"},{id:"trophy_52",category:"trophies",title:"Погреть уши",group:"Ситуативный",defaultDone:!1,detail:"Сесть у любого доступного костра.",location:"",ref:"52"},{id:"trophy_53",category:"trophies",title:"Легенды не умирают",group:"Финал",defaultDone:!1,detail:"Убить Стрелка; выпадает во всех финалах, кроме его собственного.",location:"",ref:"53"},{id:"trophy_54",category:"trophies",title:"В Зоне без перемен",group:"Финал",defaultDone:!1,detail:"Убить Коршунова; выпадает во всех финалах, кроме Варты.",location:"",ref:"54"},{id:"trophy_55",category:"trophies",title:"Бедный Йорик",group:"Финал",defaultDone:!1,detail:"Убить Шрама; выпадает во всех финалах, кроме Искры.",location:"",ref:"55"},{id:"trophy_56",category:"trophies",title:"Один неверный шаг",group:"Пропускаемый",defaultDone:!1,detail:"После боя с Фаустом принять его помощь.",location:"",ref:"56"},{id:"trophy_57",category:"trophies",title:"Посланник Монолита",group:"Пропускаемый",defaultDone:!1,detail:"После боя с Фаустом отказаться от помощи и подняться самому.",location:"",ref:"57"},{id:"trophy_58",category:"trophies",title:"Между строк",group:"Коллекционный",defaultDone:!1,detail:"Открыть тайник в Припяти кодом 13263622.",location:"",ref:"58"},{id:"trophy_59",category:"trophies",title:"Сканирование завершено",group:"Коллекционный",defaultDone:!1,detail:"Активировать все 10 сканеров и забрать артефакт из каждого.",location:"",ref:"59"},{id:"route_001",category:"route",title:"1. Выберите «Новичок» — это не обязательное условие, но ускоряет фарм прострелов, экзоскелета ножом и финальных боёв.",group:"Шаг 0. Перед новой игрой",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_002",category:"route",title:"2. Проверьте, что community-моды отключены до создания кампании.",group:"Шаг 0. Перед новой игрой",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_003",category:"route",title:"3. С первого детектора подбирайте каждый новый артефакт и отмечайте его. Ранние обычные артефакты позднее выпадают реже из-за скрытого ранга Скифа.",group:"Шаг 0. Перед новой игрой",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_004",category:"route",title:"4. У каждого нового региона дождитесь всплывающего названия — только это означает, что регион зарегистрирован.",group:"Шаг 0. Перед новой игрой",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_006",category:"route",title:"Завершите пролог — «Добро пожаловать в Зону».",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_007",category:"route",title:"В Залесье: съешьте хлеб и колбасу («На ходу»); сядьте у костра («Погреть уши»); сделайте равный обмен с торговцем («Бартер»).",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_008",category:"route",title:"У Линзы купите одно улучшение («Дело техники»).",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_009",category:"route",title:"При наличии денег сохранитесь и полностью улучшите пистолет Скифа («Пушка — пушка!»), затем загрузитесь, чтобы вернуть купоны.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_010",category:"route",title:"Сделайте скрытые убийства ножом, хедшоты и убийства через стекло/забор при каждой удобной возможности — это уменьшит финальный фарм.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_011",category:"route",title:"Заберите Странный мячик в Бульбе и Странный цветок на Маковом поле.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_012",category:"route",title:"Для «Отмычки» удобно в задании Косого привести собак со Склада знаков радиации к аномалиям за южной стеной.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_013",category:"route",title:"S01 — ДИАЛОГ В «Иголке в стоге сена» сохранитесь перед сдачей датчиков Косого. Выберите капитана Зотова и продолжайте кампанию с этим выбором. Не отдавайте датчики Рихтеру/Бате.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_015",category:"route",title:"Датчики Зотову нужны для ветки Варты в «Ответы стоят дорого» и надёжного доступа на Икар.",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_016",category:"route",title:"После выхода из Малой Зоны получите «Удачной охоты, сталкер».",group:"Шаг 1. Пролог и Малая Зона",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_018",category:"route",title:"5. На Терриконе при встрече с Коршуновым покажите ему необычный КПК. Это сохраняет удобный доступ к Икару и связанным побочкам.",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_019",category:"route",title:"6. В «Ответы стоят дорого» выбирайте по порядку: «Я ищу Нестора» → у Коршунова «Хочу поговорить с Чернозёмом» → «Принимаю условия».",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_020",category:"route",title:"7. Возьмите необязательную задачу допросить пленного. Сделайте S02 у вагончика, убейте охраняющих пленного бойцов Варты, выпустите/выслушайте бандита и дождитесь конца разговора с Чернозёмом по рации. Получите «Варте по пасти».",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_022",category:"route",title:"8. Сразу загрузите S02 и пройдите эпизод без убийства охраны. Трофей уже навсегда в PSN, а отношения с Вартой останутся чистыми.",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_023",category:"route",title:"9. У Гурона возьмите «Бандитский беспредел». В котельной не убивайте Доцента; потребуйте сведения о тайнике Шаха, затем заберите уникальный ствол — «Ход сделан».",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_024",category:"route",title:"ФАРМ БУМ! Перед разговором/боем с Вараном сохранитесь и взрывайте красный баллон рядом с врагами. Счётчик допускает повтор через загрузку. Альтернатива: мост севернее Азимута с собаками и бочками.",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_025",category:"route",title:"На Лесопилке сюжетная встреча со Шрамом даст «Будешь гренку?». Это автоматический трофей.",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_026",category:"route",title:"По пути собирайте все флешки текущих регионов из приложения; особенно легко забыть крышу ворот в Железный лес .",group:"Шаг 2. Свалка и ранняя ветка Варты",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_028",category:"route",title:"ДЕДЛАЙН Закройте «В яблочко», «Три капитана» и «Сталкерскую смекалку» до входа в НИИЧАЗ. После сюжетной катастрофы Икар и часть побочек могут стать недоступны.",group:"Шаг 3. Затон, Икар и обязательные побочки до НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_030",category:"route",title:"10. На «Шевченко» возьмите задание Бороды о пропавших сталкерах.",group:"3.1 «В яблочко»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_031",category:"route",title:"11. У Худрука не платите и не начинайте перестрелку. Согласитесь на его игру.",group:"3.1 «В яблочко»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_032",category:"route",title:"12. Сделайте S03 и за отведённое время прострелите три яблока над головами пленников. Можно использовать своё точное оружие.",group:"3.1 «В яблочко»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_035",category:"route",title:"13. На Султанске поговорите с Соней Калиной, затем выполните поручение Султана «Загадочное дело».",group:"3.2 «Загадочное дело» и «Три капитана»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_036",category:"route",title:"14. Условия появления «Трёх капитанов»: завершены «В яблочко», «Загадочное дело» и основной квест «В поисках гида». После этого снова поговорите с Соней Калиной.",group:"3.2 «Загадочное дело» и «Три капитана»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_037",category:"route",title:"15. Примите заказ на Бороду и Султана, но собирайтесь предать Соню. Сделайте S04 перед краном",group:"3.2 «Загадочное дело» и «Три капитана»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_039",category:"route",title:"16. Поднимитесь на кран, убейте снайпера, включите радио и не стреляйте по Бороде/Султану. Дослушайте их разговор и дождитесь фразы Сони «Я сама с этим разберусь». Если фразы/наёмников нет, загрузите S04; иногда помогает бросить гранату за восточную стену, не спускаясь с круглой площадки крана.",group:"3.2 «Загадочное дело» и «Три капитана»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_040",category:"route",title:"17. Уничтожьте пришедших наёмников Сони, сохранив Бороду и Султана. Поговорите с обоими — «Как в старые добрые».",group:"3.2 «Загадочное дело» и «Три капитана»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_042",category:"route",title:"18. После основного «Как мотылёк на огонь» поговорите с техником сержантом Еремеевым на Икаре.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_043",category:"route",title:"19. Если он сначала выдаёт «Шоковую терапию», завершите её и вернитесь. Следующее задание — «Халтурка».",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_044",category:"route",title:"20. У склада станции обслуживания не входите внутрь и не трогайте ни один рубильник/красную кнопку.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_045",category:"route",title:"21. Поднимитесь со стороны поезда на металлический проход. Через верхнее окно выстрелите в красную канистру за ящиком с деталями — ящик упадёт наружу. Альтернатива: подтащить коробку под окно и снять детали прыжком.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_046",category:"route",title:"22. Подберите детали снаружи — трофей появляется сразу. Если зашли внутрь или активировали питание, загрузитесь.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_047",category:"route",title:"На Затоне заберите Странную воду с 22:00 до 04:00 и сканер Лаборатории гидродинамики.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_048",category:"route",title:"До похода в Болота подготовьте 10–15 энергетиков, антирады и запасные ручные сохранения.",group:"3.3 Икар: «Сталкерская смекалка»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_050",category:"route",title:"23. На южном острове Болот активируйте сканер №2 и обязательно заберите артефакт из устройства.",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_051",category:"route",title:"24. На базе Чистого неба по сюжету верните Сканер — «Главный приз».",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_052",category:"route",title:"25. Перед входом в НИИЧАЗ сделайте S05. Сверьте ранние флешки и убедитесь, что Икарские трофеи получены.",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_054",category:"route",title:"26. В дата-центре, когда задача требует забрать накопитель данных, спуститесь на самый нижний уровень. Под одной из лестниц лежит сумка с флешкой Integral-A — «Уплотнитель муфты возвратного механизма». Подберите её до ухода.",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_055",category:"route",title:"ЕДИНСТВЕННАЯ НЕОБРАТИМАЯ ФЛЕШКА Дата-центр НИИЧАЗ закрывается навсегда. Если пропустили Integral-A, поможет только S05/более ранний сейв той же кампании.",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_056",category:"route",title:"В финальной развилке НИИЧАЗ для максимальной совместимости со старыми патчами можно поддержать Дубного/Искру — реплика «Я с тобой». На новой кампании 2026 года это уже не обязательно для «Флешки-рояля»: Зубр-19 перенесён в Военторг на Дуге.",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_057",category:"route",title:"Покинув разрушенный комплекс, получите «Хрустальный замок».",group:"Шаг 4. Болота и НИИЧАЗ",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_059",category:"route",title:"S06 И СКРЫТЫЙ ТАЙМЕР После радиосообщения Бати не исследуйте мир и не используйте проводника. Сразу отправляйтесь в Залесье: промедление может автоматически уничтожить поселение.",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_060",category:"route",title:"27. Убейте первую группу Монолита у Залесья и поговорите с Батей, чтобы начать «На грани».",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_061",category:"route",title:"28. До ухода поговорите с медиком Николайчем; принесите ему набор медика.",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_062",category:"route",title:"29. Верните Хомяка и его охранника в главный зал. При конфликте лучше заплатить/уговорить, чтобы оба дошли живыми.",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_063",category:"route",title:"30. Верните личное оружие Колдуну.",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_064",category:"route",title:"31. Найдите дядю Лёню и разберитесь с ним. После отчёта обычно выдаётся «Крещение огнём».",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_065",category:"route",title:"32. Не уходите: отбейте вторую атаку Монолита и дождитесь радиосообщения, что Залесье выстояло. Так хаб не останется «мёртвым» при дальнейшей игре.",group:"Шаг 5. После НИИЧАЗ — немедленно спасти Залесье",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_067",category:"route",title:"33. Продвигайтесь по сюжетной ветке до «Счастье для всех» (Искра) или «Ещё раз в прорыв» (Варта). Обе приводят к одной сцене на крыше.",group:"Шаг 6. Дуга и два выбора Фауста",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_068",category:"route",title:"34. Сделайте S07 до финального этапа боя с Фаустом.",group:"Шаг 6. Дуга и два выбора Фауста",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_070",category:"route",title:"35. После боя выберите [Принять помощь] — получите «Один неверный шаг».",group:"Шаг 6. Дуга и два выбора Фауста",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_071",category:"route",title:"36. Загрузите S07, повторите бой и выберите [Подняться самому] / отказ от помощи — получите «Посланник Монолита».",group:"Шаг 6. Дуга и два выбора Фауста",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_072",category:"route",title:"37. Продолжайте кампанию именно со второго варианта. Сюжетное убийство Фауста даёт «На всё воля Монолита».",group:"Шаг 6. Дуга и два выбора Фауста",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_074",category:"route",title:"38. В сюжетном «Тёмные времена» помогите аспиранту Щербе у профессора Двупалова; не отказывайтесь от сотрудничества.",group:"Шаг 7. Щерба и «На поводу»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_075",category:"route",title:"39. В побочном «Во имя науки» соберите четыре ошейника с отмеченных мутантов и принесите их Щербе.",group:"Шаг 7. Щерба и «На поводу»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_076",category:"route",title:"40. У блокиратора сделайте S08. Сразу расстреляйте или разбейте устройство. Не выбирайте перенастройку — даже последующее разрушение может не засчитаться.",group:"Шаг 7. Щерба и «На поводу»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_077",category:"route",title:"41. Продолжайте сюжет до «Тонких материй». Когда Щерба позовёт за наградой, вернитесь в бункер, переживите ловушку и завершите сцену — «На поводу».",group:"Шаг 7. Щерба и «На поводу»",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_079",category:"route",title:"Сюжетные встречи по пути автоматически дают «Вижу, у тебя много вопросов», «Врачебная тайна», «Живая легенда» и «Хранитель Припяти».",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_080",category:"route",title:"Откройте 21 регион до Генераторов. Отдельно поймайте триггеры Железного леса и ЧАЭС — подсказки ниже.",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_081",category:"route",title:"Завершите 77-позиционный чек-лист флешек, 69 обычных артефактов, 6 архиартефактов и 10 сканеров. У каждого сканера заберите артефакт из контейнера — одной активации недостаточно.",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_082",category:"route",title:"В Припяти откройте тайник «Между строк» кодом 13263622. Из-за визуального бага панель может показать последнюю цифру как 3; это нормально.",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_083",category:"route",title:"Закройте все накопительные/боевые трофеи до «Внизу». Особенно проверьте мутантов, прострелы, бочки, стелс-лагерь и миллион купонов.",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"route_084",category:"route",title:"S12 Когда игра предупреждает о точке невозврата в задании «Внизу», отмените вход, создайте S12 и ещё раз проверьте мастер-чек- лист. После подтверждения все активные побочки провалятся.",group:"Шаг 8. Припять и полная зачистка свободного мира",defaultDone:!1,detail:"",location:"",ref:""},{id:"save_S01",category:"saves",title:"S01 · Датчики Зотову",group:"Ручные сохранения",defaultDone:!1,detail:`«Иголка в стоге сена», перед передачей датчиков Косого. Продолжать с выбором Зотова.
